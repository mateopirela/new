name: Construir y desplegar tiendas

on:
  # Se ejecuta cuando el agente analista actualiza los informes...
  push:
    branches: [main]
    paths:
      - "reports/**"
      - "storefront/**"
      - ".github/workflows/build-stores.yml"
  # ...y también a mano.
  workflow_dispatch:

# Permisos necesarios para publicar en GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Evita despliegues solapados.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: storefront/package-lock.json

      - name: Configurar Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Instalar dependencias
        working-directory: storefront
        run: npm ci

      - name: Construir tiendas
        working-directory: storefront
        env:
          # Configura estos valores como Variables del repo (Settings → Variables).
          STORE_WHATSAPP: ${{ vars.STORE_WHATSAPP || '573000000000' }}
          STORE_BRAND_SUFFIX: ${{ vars.STORE_BRAND_SUFFIX || 'Store' }}
          STORE_MAX: ${{ vars.STORE_MAX || '10' }}
          STORE_REGION: ${{ vars.STORE_REGION || 'CO' }}
          # Base y URL provistas por configure-pages.
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
          SITE_URL: ${{ steps.pages.outputs.origin }}
        run: npm run build

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: storefront/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
